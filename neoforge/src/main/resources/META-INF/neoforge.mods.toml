modLoader = "javafml"
loaderVersion = "[1,)"
issueTrackerURL = "https://github.com/iSweat-exe/Blahaj-Reborn/issues"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
iconFile = "assets/blahaj/icon.png"
displayURL = "https://github.com/iSweat-exe/Blahaj-Reborn"
description = '''${mod_description}'''

[[mixins]]
config = "blahaj.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[26.3,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
type = "required"
versionRange = "[${geckolib_version},)"
ordering = "AFTER"
side = "BOTH"
