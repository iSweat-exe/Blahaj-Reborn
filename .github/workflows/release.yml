name: Release

# Push a tag such as v0.1.0 to build all three loaders and attach the jars to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build all loaders
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          draft: false
          files: |
            fabric/build/libs/blahaj-reborn-fabric-*[0-9].jar
            neoforge/build/libs/blahaj-reborn-neoforge-*[0-9].jar
            forge/build/libs/blahaj-reborn-forge-*[0-9].jar
